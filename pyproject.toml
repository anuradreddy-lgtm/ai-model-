[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-ai"
version = "1.0.0"
description = "JARVIS AI — Modular Open-Source Windows Desktop Assistant"
readme = "README.md"
authors = [{ name = "JARVIS Team" }]
dependencies = [
    "PySide6>=6.8.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "pyttsx3>=2.90",
    "sounddevice>=0.4.6",
    "SpeechRecognition>=3.10.0",
    "pytest>=8.0.0",
    "pywin32>=306",
]

[project.scripts]
jarvis = "jarvis.main:main"
